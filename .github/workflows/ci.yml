name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  merge_group:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  project-check:
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/project-check.yml@cb10612004f98e6ec10158af72c4d0e1a044e436
    with:
      project-dir: .
      target: ci-quality

  commit-messages:
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/commit-messages.yml@cb10612004f98e6ec10158af72c4d0e1a044e436
    permissions:
      contents: read
      pull-requests: read

  python-shared:
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/python.yml@cb10612004f98e6ec10158af72c4d0e1a044e436
    with:
      project-dir: .
      manager: uv
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'
      coverage-source: prompt_contracts
      coverage-min: 90
      build-distribution: true

  security:
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/security.yml@cb10612004f98e6ec10158af72c4d0e1a044e436
    with:
      languages: '["python", "actions"]'
    permissions:
      contents: read
      actions: read
      pull-requests: read
      security-events: write

  matrix-tests:
    name: Matrix (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies from lockfile
        run: uv sync --frozen --all-groups --extra gateway

      - name: Verify import boundaries
        run: uv run --frozen python scripts/check_import_boundaries.py --src src

      - name: Run offline test suite
        run: uv run --frozen pytest -m "not live and not promptfoo" --cov=prompt_contracts --cov-branch --cov-fail-under=90

  contract-and-package-checks:
    name: Contract Locks, Distribution & Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: make ci-install

      - name: Run quality and generated lock checks
        run: |
          make ci-quality
          make ci-generated

      - name: Verify released contracts against repository baseline
        env:
          BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'origin/main' }}
        run: uv run --frozen python scripts/verify_repository_contracts.py --baseline-ref "$BASELINE_REF"

      - name: Build and verify package distributions
        run: make ci-package

      - name: Build documentation with strict mode
        run: make ci-docs

  promptfoo-offline:
    name: Promptfoo Offline Evaluation Parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tools/promptfoo/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen --all-groups --extra gateway

      - name: Run Promptfoo offline evaluation suite
        env:
          PYTEST_ADDOPTS: ''
        run: |
          make ci-promptfoo

  dependency-support:
    name: Dependency support (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [floor, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
      - run: uv sync --frozen --all-groups --extra gateway
      - name: Test declared dependency support
        env:
          DEPENDENCY_MODE: ${{ matrix.mode }}
        run: uv run --frozen python scripts/check_dependency_support.py --mode "$DEPENDENCY_MODE"

  repository-gate:
    name: Repository gate
    if: always()
    needs: [project-check, commit-messages, python-shared, security, matrix-tests, contract-and-package-checks, promptfoo-offline, dependency-support]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failed:
              raise SystemExit(f'Mandatory checks did not succeed: {failed}')
          PY
