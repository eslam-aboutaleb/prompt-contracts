[build-system]
requires = ["hatchling>=1.24.0,<2.0.0"]
build-backend = "hatchling.build"

[project]
name = "example-consumer"
version = "0.1.0"
description = "Synthetic consumer package demonstrating importlib.resources loading with prompt-contracts."
requires-python = ">=3.11"
dependencies = [
    "prompt-contracts>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/example_consumer"]
